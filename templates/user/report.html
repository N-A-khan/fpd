{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card p-4">

        <h2>
            Report Fake Product
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label>Product Name</label>

                <input
                    type="text"
                    name="product_name"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label>Brand</label>

                <input
                    type="text"
                    name="brand"
                    class="form-control"
                >

            </div>

            <div class="mb-3">

                <label>Seller Name</label>

                <input
                    type="text"
                    name="seller_name"
                    class="form-control"
                >

            </div>

            <div class="mb-3">

                <label>Reason</label>

                <textarea
                    name="reason"
                    class="form-control"
                    rows="5"
                    required>
                </textarea>

            </div>

            <button class="btn btn-danger">

                Submit Report

            </button>

        </form>

    </div>

</div>

{% endblock %}
